<!DOCTYPE html>
<html>

<head>
    <style type="text/css">
        .elementsRow {
            position: absolute;
            display: table;
            width: 100%;
            top: 0px;
        }

        .cell {
            display: table-cell;
            vertical-align: middle;
        }

        .container {
            position: relative;
        }

        html {
            height: 100%;
            background: linear-gradient(0deg, #aaddb2, #17ff3a);
        }
    </style>
</head>

<body>
    <div class="container">
        <svg class="connector" viewBox="0 0 600 100">
            <path d="
               M 0 20 L 150 20
               C 170 20 170 70 190 70
               L 350 70
               C 370 70 370 40 390 40
               L 600 40" fill="none" stroke="#000" stroke-width="2" />
        </svg>
        <div class="elementsRow">
            <div class="cell">Test1</div>
            <div class="cell">Test2</div>
            <div class="cell">Test3</div>
        </div>
    </div>
</body>

</html>
